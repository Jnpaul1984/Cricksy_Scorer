name: ECR Scan Gate Tests
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/ecr-scan-gate.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/deploy-backend.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/tests/test-ecr-scan-gate.sh
